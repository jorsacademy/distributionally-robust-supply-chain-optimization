name: tests
on: [push, pull_request]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          pip install "numpy>=1.24" "scipy>=1.11" "scikit-learn>=1.4"
      - name: Self-test
        run: python run_generative_supply_chain.py --self-test
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Real CVAE + stochastic optimization smoke
        run: |
          python run_generative_supply_chain.py \
            --seed 42 --horizon 5 \
            --train-samples 160 --validation-samples 50 \
            --test-contexts 3 --epochs 5 --batch-size 64 \
            --latent-dim 4 --hidden 48 --scenarios 32 --eval-scenarios 64
