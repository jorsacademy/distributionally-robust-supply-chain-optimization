[build-system]
requires=["setuptools>=69"]
build-backend="setuptools.build_meta"

[project]
name="generative-supply-chain-scenarios-stochastic-optimization"
version="0.1.0"
description="Conditional generative demand/lead-time scenarios coupled to risk-aware supply-chain capacity optimization."
requires-python=">=3.10"
dependencies=["numpy>=1.24","scipy>=1.11","scikit-learn>=1.4","torch>=2.3"]

[tool.setuptools.packages.find]
include=["supplygen*"]
