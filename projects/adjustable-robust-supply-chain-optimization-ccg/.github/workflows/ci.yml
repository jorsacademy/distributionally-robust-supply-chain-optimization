name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest

      - name: MILP adversary benchmark smoke run
        run: python -m aro_ccg --gamma-demand 2 --gamma-disruption 1 --oracle milp

      - name: Fractional-budget fallback smoke run
        run: python -m aro_ccg --gamma-demand 1.5 --gamma-disruption 1 --oracle auto
