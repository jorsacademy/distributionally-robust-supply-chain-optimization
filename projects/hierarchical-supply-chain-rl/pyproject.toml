[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-supply-chain-rl"
version = "0.1.0"
description = "Hierarchical reinforcement learning benchmark for tactical allocation and operational replenishment in supply chains."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "gymnasium>=0.29",
  "pandas>=2.0",
]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.3"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
