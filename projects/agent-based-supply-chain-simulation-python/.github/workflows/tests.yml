name: tests

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ABM self-test
        run: python agent_based_supply_chain_simulation.py --self-test

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      - name: Run stochastic policy-optimization smoke test
        run: |
          python agent_based_supply_chain_simulation.py \
            --selection-replications 8 \
            --validation-replications 12 \
            --seed 42
